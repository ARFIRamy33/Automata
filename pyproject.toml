[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "automata-extensions"
version = "0.1.0"
description = "Extensions of automata-lib 9.2.0 through inheritance and mixins"
requires-python = ">=3.9"
dependencies = ["automata-lib==9.2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["automata_extensions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
